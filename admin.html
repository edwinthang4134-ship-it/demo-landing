<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>报名后台</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+SC:wght@400;500;700&family=Noto+Serif+SC:wght@600;700&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.js"></script>
<style>
:root{
  --primary:#6b3f24; --accent:#d98a2b; --bg:#fbf6ef; --surface:#ffffff;
  --text:#2b1d14; --muted:#6f6258; --line:#e8dccd; --ok:#2f6b3a;
  --s1:8px; --s2:16px; --s3:24px; --s4:40px; --s5:64px;
}
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:"Noto Sans SC",sans-serif;font-size:16px;line-height:1.6;color:var(--text);background:var(--bg)}
h1,h2{font-family:"Noto Serif SC",serif;color:var(--primary);line-height:1.3}
.wrap{max-width:1120px;margin:0 auto;padding:0 var(--s2)}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:var(--s1);min-height:48px;padding:0 var(--s3);border:0;border-radius:8px;background:var(--accent);color:#fff;font:700 16px "Noto Sans SC",sans-serif;text-decoration:none;cursor:pointer}
.btn:hover{filter:brightness(.94)}
.btn.ghost{background:transparent;color:var(--primary);border:1px solid var(--line)}
.btn.wa{background:var(--ok)}
.btn:disabled{opacity:.6;cursor:default}
input,select,textarea{width:100%;min-height:48px;padding:var(--s1) var(--s2);border:1px solid var(--line);border-radius:8px;font:16px "Noto Sans SC",sans-serif;background:var(--surface);color:var(--text)}
textarea{min-height:80px;resize:vertical}
label{font-weight:500;display:block}
label input{margin-top:var(--s1)}
header{background:var(--surface);border-bottom:1px solid var(--line)}
header .wrap{display:flex;align-items:center;justify-content:space-between;min-height:64px;gap:var(--s2)}
header h1{font-size:20px}
.hidden{display:none!important}
.login{max-width:400px;margin:var(--s5) auto;padding:var(--s3);background:var(--surface);border:1px solid var(--line);border-radius:12px;display:grid;gap:var(--s2)}
.msg{min-height:24px;color:#a33;font-weight:500}
.msg.info{color:var(--muted)}
main{padding:var(--s3) 0 var(--s5)}
.stats{display:flex;flex-wrap:wrap;gap:var(--s1);margin:var(--s2) 0 var(--s3)}
.pill{padding:4px 16px;border:1px solid var(--line);border-radius:999px;background:var(--surface)}
.pill b{color:var(--primary)}
.list{display:grid;gap:var(--s2)}
.row{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:var(--s2);display:grid;gap:var(--s2)}
.cell .k{display:block;font-size:14px;color:var(--muted)}
.cell .v{font-weight:500;word-break:break-all}
.notes{display:grid;gap:var(--s1)}
.saved{color:var(--ok);font-size:14px;min-height:21px}
.head{display:none}
.empty{padding:var(--s4);text-align:center;color:var(--muted);background:var(--surface);border:1px dashed var(--line);border-radius:12px}
@media (min-width:900px){
  .head,.row{grid-template-columns:140px 1fr 150px 150px 1.3fr 150px;align-items:start;gap:var(--s2)}
  .head{display:grid;padding:0 var(--s2);color:var(--muted);font-size:14px}
  .cell .k{display:none}
  .list{gap:var(--s1)}
}
</style>
</head>
<body>

<div id="login-view" class="hidden">
  <form class="login" id="login-form">
    <h2>报名后台登录</h2>
    <label>Email<input id="email" type="email" autocomplete="username" required></label>
    <label>密码<input id="password" type="password" autocomplete="current-password" required></label>
    <div class="msg" id="login-msg" role="alert"></div>
    <button class="btn" id="login-btn" type="submit">登录</button>
  </form>
</div>

<div id="app-view" class="hidden">
  <header>
    <div class="wrap">
      <h1>报名后台</h1>
      <button class="btn ghost" id="logout" type="button">登出</button>
    </div>
  </header>
  <main>
    <div class="wrap">
      <div class="stats" id="stats"></div>
      <div class="msg" id="app-msg" role="alert"></div>
      <div class="head"><div>报名时间</div><div>名字</div><div>电话</div><div>进度</div><div>备注</div><div></div></div>
      <div class="list" id="list"></div>
    </div>
  </main>
</div>

<div id="denied-view" class="hidden">
  <div class="login">
    <h2>没有权限</h2>
    <p>这个账号不在后台名单里。请联络网站负责人。</p>
    <button class="btn" id="denied-logout" type="button">登出</button>
  </div>
</div>

<script>
var SUPABASE_URL = "https://fmczytzsalhibhhftbbu.supabase.co";
var SUPABASE_KEY = "sb_publishable_6YUGy6UfWsNGhFXOs1Hfig_pnDXgHf6"; // 公开的 publishable key
var COUNTRY_CODE = "60"; // 0 开头的号码，把 0 换成这个国码
var STATUSES = ["新进来","联络了","成交","没兴趣"];
var db = window.supabase.createClient(SUPABASE_URL, SUPABASE_KEY); // 后台要记住登录

var $ = function(id){ return document.getElementById(id); };
function show(which){
  ["login-view","app-view","denied-view"].forEach(function(v){ $(v).classList.toggle("hidden", v !== which); });
}
function el(tag, cls, text){
  var e = document.createElement(tag);
  if(cls) e.className = cls;
  if(text !== undefined) e.textContent = text;
  return e;
}
function waNumber(phone){
  var d = String(phone).replace(/\D/g, "");
  if(d.indexOf("0") === 0) d = COUNTRY_CODE + d.slice(1);
  return d;
}
function fmtTime(iso){
  return new Date(iso).toLocaleString([], {year:"numeric",month:"2-digit",day:"2-digit",hour:"2-digit",minute:"2-digit"});
}

async function start(){
  var s = await db.auth.getSession();
  if(!s.data.session){ show("login-view"); return; }
  var email = (s.data.session.user.email || "").toLowerCase();
  var a = await db.from("admins").select("email").eq("email", email).maybeSingle();
  if(a.error || !a.data){ show("denied-view"); return; }
  show("app-view");
  load();
}

async function load(){
  $("app-msg").textContent = "";
  var r = await db.from("signups").select("id,created_at,name,phone,status,notes").order("created_at", {ascending:false});
  if(r.error){ $("app-msg").textContent = "读取名单失败，请重新整理页面。"; return; }
  render(r.data);
}

function render(rows){
  var stats = $("stats"); stats.textContent = "";
  var total = el("div","pill"); total.append("一共 ", el("b","",String(rows.length)), " 个"); stats.append(total);
  STATUSES.forEach(function(st){
    var n = rows.filter(function(x){ return x.status === st; }).length;
    var p = el("div","pill"); p.append(st+" ", el("b","",String(n))); stats.append(p);
  });
  var list = $("list"); list.textContent = "";
  if(!rows.length){ list.append(el("div","empty","还没有人报名。")); return; }
  rows.forEach(function(r){ list.append(rowEl(r)); });
}

function cell(label, child){
  var c = el("div","cell");
  c.append(el("span","k",label), child);
  return c;
}

function rowEl(r){
  var row = el("div","row");
  row.append(cell("报名时间", el("span","v",fmtTime(r.created_at))));
  row.append(cell("名字", el("span","v",r.name)));
  row.append(cell("电话", el("span","v",r.phone)));

  var sel = el("select");
  sel.setAttribute("aria-label","进度");
  STATUSES.forEach(function(st){
    var o = el("option","",st); o.value = st; if(st === r.status) o.selected = true; sel.append(o);
  });
  var statusBox = el("div","notes"); var statusSaved = el("div","saved");
  statusBox.append(sel, statusSaved);
  sel.addEventListener("change", async function(){
    statusSaved.textContent = "存放中…";
    var u = await db.from("signups").update({status: sel.value}).eq("id", r.id).select("id");
    if(u.error || !u.data || !u.data.length){ statusSaved.textContent = "没存成功，请再试一次"; statusSaved.style.color = "#a33"; return; }
    statusSaved.style.color = ""; statusSaved.textContent = "已存";
    r.status = sel.value;
    load();
  });
  row.append(cell("进度", statusBox));

  var ta = el("textarea"); ta.value = r.notes || ""; ta.maxLength = 2000; ta.setAttribute("aria-label","备注");
  var save = el("button","btn ghost","存"); save.type = "button";
  var saved = el("div","saved");
  save.addEventListener("click", async function(){
    save.disabled = true; saved.style.color = ""; saved.textContent = "存放中…";
    var u = await db.from("signups").update({notes: ta.value}).eq("id", r.id).select("id");
    save.disabled = false;
    if(u.error || !u.data || !u.data.length){ saved.textContent = "没存成功，请再试一次"; saved.style.color = "#a33"; return; }
    saved.textContent = "已存";
  });
  var nb = el("div","notes"); nb.append(ta, save, saved);
  row.append(cell("备注", nb));

  var wa = el("a","btn wa","WhatsApp 他");
  wa.target = "_blank"; wa.rel = "noopener";
  wa.href = "https://wa.me/" + waNumber(r.phone) + "?text=" + encodeURIComponent("你好 " + r.name + "，收到你在网站的报名，想跟你聊聊。");
  row.append(wa);
  return row;
}

$("login-form").addEventListener("submit", async function(e){
  e.preventDefault();
  var msg = $("login-msg"), btn = $("login-btn");
  msg.textContent = ""; btn.disabled = true;
  var r = await db.auth.signInWithPassword({ email: $("email").value.trim(), password: $("password").value });
  btn.disabled = false;
  if(r.error){ msg.textContent = "Email 或密码不对，请再试一次。"; return; }
  $("password").value = "";
  start();
});
async function logout(){ await db.auth.signOut(); show("login-view"); }
$("logout").addEventListener("click", logout);
$("denied-logout").addEventListener("click", logout);

start();
</script>
</body>
</html>
